
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Monitoramento da Piscina</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>

    <h1>Monitoramento da Piscina</h1>

    <p>
        Sistema de monitoramento da qualidade da água
    </p>

</header>

<div class="container">

    <h2 class="titulo-sensores">
        Dados dos sensores
    </h2>

    <div class="cards">

        <!-- TEMPERATURA -->

        <div class="card">

            <i class="fa-solid fa-temperature-half"></i>

            <h2>Temperatura em °C</h2>

            <p class="valor" id="temperatura">
                -- °C
            </p>

        </div>

        <!-- PH -->

        <div class="card">

            <i class="fa-solid fa-flask"></i>

            <h2>pH</h2>

            <p class="valor" id="ph">
                --
            </p>

        </div>

        <!-- CLORO -->

        <div class="card">

            <i class="fa-solid fa-droplet"></i>

            <h2>Cloro em ppm</h2>

            <p class="valor" id="cloro">
                -- ppm
            </p>

        </div>

    </div>

    <!-- STATUS -->

    <div class="status">

        <h2>Status da Piscina</h2>

        <p id="resultado">
            Analisando...
        </p>

    </div>

</div>

<script>

// =====================================
// THINGSPEAK
// =====================================

const enderecoAPI =
"https://api.thingspeak.com/channels/3456735/feeds.json?results=1";

// =====================================
// ATUALIZAR DADOS
// =====================================

function atualizarDados() {

    fetch(enderecoAPI)

    .then(response => {

        if (!response.ok) {
            throw new Error("Erro ao acessar o ThingSpeak");
        }

        return response.json();

    })

    .then(dados => {

        if (!dados.feeds || dados.feeds.length === 0) {
            throw new Error("Nenhum dado recebido");
        }

        const ultimoDado = dados.feeds[0];

        // Field 1: Temperatura
        const temperatura =
            parseFloat(ultimoDado.field1);

        // Field 2: pH
        const ph =
            parseFloat(ultimoDado.field2);

        // Field 3: Cloro em ppm
        const cloro =
            parseFloat(ultimoDado.field3);


        // =====================================
        // MOSTRAR TEMPERATURA
        // =====================================

        document.getElementById("temperatura").textContent =
            Number.isFinite(temperatura)
                ? temperatura.toFixed(1) + " °C"
                : "-- °C";


        // =====================================
        // MOSTRAR PH
        // =====================================

        document.getElementById("ph").textContent =
            Number.isFinite(ph)
                ? ph.toFixed(2)
                : "--";


        // =====================================
        // MOSTRAR CLORO EM PPM
        // =====================================

        document.getElementById("cloro").textContent =
            Number.isFinite(cloro)
                ? cloro.toFixed(2) + " ppm"
                : "-- ppm";


        // =====================================
        // ATUALIZAR STATUS
        // =====================================

        verificarStatus(ph, cloro);


        // =====================================
        // CONFERIR DADOS
        // =====================================

        console.log("Dados recebidos:", {
            temperatura: temperatura,
            ph: ph,
            cloro: cloro
        });

    })

    .catch(erro => {

        console.log("Erro ao buscar dados:", erro);

        document.getElementById("resultado").textContent =
            "⚠️ Não foi possível obter os dados";

    });

}


// =====================================
// VERIFICAR STATUS DA PISCINA
// =====================================

function verificarStatus(ph, cloro) {

    let mensagem;

    if (
        !Number.isFinite(ph) ||
        !Number.isFinite(cloro)
    ) {

        mensagem =
            "🟡 Aguardando dados dos sensores";

    }

    else if (
        ph < 7.0 ||
        ph > 8.0
    ) {

        mensagem =
            "🔴 Necessário verificar o pH";

    }

    else if (cloro < 1.0) {

        mensagem =
            "🟡 Atenção: nível de cloro baixo";

    }

    else if (cloro > 3.0) {

        mensagem =
            "🟡 Atenção: nível de cloro elevado";

    }

    else {

        mensagem =
            "🟢 Piscina em boas condições";

    }

    document.getElementById("resultado").textContent =
        mensagem;

}


// =====================================
// INICIAR ATUALIZACOES
// =====================================

atualizarDados();

setInterval(
    atualizarDados,
    5000
);

</script>

</body>
</html>
